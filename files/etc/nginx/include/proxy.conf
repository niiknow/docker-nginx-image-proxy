# Generic reverse-proxy snippet; include it inside a location block.
#
# Variables it uses:
#   $forward_scheme - upstream scheme (http/https). Defined in nginx.conf as a map
#                     on $host that defaults to "http"; override with a map entry or
#                     `set $forward_scheme https;` in your server block.
#   $server         - upstream hostname or IP to proxy to. NOT defined anywhere by
#                     default: you must `set $server ...;` before including this file.
#   $port           - upstream port. NOT defined by default: you must `set $port ...;`.
#
# Example:
#   server {
#       server_name   www.example.com;
#       set $server   10.0.0.5;
#       set $port     8080;
#       location / {
#           include /etc/nginx/include/proxy.conf;
#       }
#   }
#
# Without $server and $port set, nginx fails to start with: unknown "server" variable

add_header       X-Served-By $host;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Scheme $scheme;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header X-Real-IP          $remote_addr;
proxy_pass       $forward_scheme://$server:$port$request_uri;
