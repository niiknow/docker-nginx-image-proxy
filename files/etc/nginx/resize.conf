# Image resize endpoint for a site; include inside a server block:
#
#     include /etc/nginx/resize.conf;
#
# Requests to /rx/<options>/<image url> are handled by the shared resize server
# in sites-enabled/1-resize.conf (127.0.0.1:9082).  ^~ keeps regex locations of
# the site (e.g. \.jpg$ in include/assets.conf) from taking these requests.
location ^~ /rx/ {
    # no URI part: the request is passed exactly as the client encoded it
    proxy_pass                http://127.0.0.1:9082;
    proxy_http_version        1.1;
    proxy_set_header          Host            $host;
    proxy_set_header          X-Forwarded-For $proxy_add_x_forwarded_for;

    # the resize server already caches and returns final statuses/bodies
    # (empty gif + X-ImageProxy-Error); pass them through untouched
    proxy_cache               off;
    proxy_intercept_errors    off;
    proxy_read_timeout        90s;
}
