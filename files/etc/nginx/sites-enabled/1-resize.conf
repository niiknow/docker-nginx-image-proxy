# Image resize service, shared by every site (same pattern as 1-geoip.conf).
#
# This internal server does all the work: parse /rx/ options, fetch the origin
# image, resize/crop, cache, follow redirects and map errors.  A site enables it
# by adding this inside its server block (see server-conf.example):
#
#     include /etc/nginx/resize.conf;
#
# Settings here apply to all sites: origin host allow-list, cache, timeouts,
# image_filter limits.

# own cache zone name, so an older all-in-one server.conf (zone "imgproxy") can still load
proxy_cache_path /var/cache/nginx/imgresize levels=1:2 keys_zone=imgresize:10m max_size=1g inactive=45m;

# gravity -> image_filter_crop_offset {left,center,right} {top,center,bottom}
# default (no gravity) is NorthWest
map $gravity $crop_offx {
    default                     left;
    "~East$"                    right;
    "~^(North|South|Center)$"   center;
}

map $gravity $crop_offy {
    default                     top;
    "~^South"                   bottom;
    "~^(West|East|Center)$"     center;
}

# classify the origin response when image_filter fails (415), see @image_error
# formats image_filter can decode: jpeg, gif, png, webp, bmp, tiff
map $upstream_http_content_type $origin_image_type {
    default                                                       not_image;
    ""                                                            unknown;
    "~*^(application|binary)/octet-stream"                        unknown;
    "~*^image/(jpe?g|pjpeg|gif|png|webp|bmp|x-ms-bmp|tiff?)\b"    supported;
    "~*^image/"                                                   unsupported;
}

server {
    listen                           127.0.0.1:9082;
    server_name                      resize;
    access_log                       off; # requests are logged by the site server

    set $width     -;
    set $height    -;
    set $rotate    0;
    set $quality   96; # default to best quality in case image previously optimized
    set $sharpen   0;
    set $debugkey  "empty";
    set $myhost    "";
    set $ofmt      "";
    set $debugcode "";
    set $gravity   ""; # mapped to $crop_offx/$crop_offy above

    root                             /usr/share/nginx/html;
    error_page                       301 302 307 = @handle_redirect;

    # return a transparent 1x1 gif on errors; the original status code is kept
    # so <img onerror> handlers still fire.  Comment out to return plain errors.
    error_page                       403 404 422 500 502 503 504 @empty_gif;

    # image_filter answers 415 for anything it cannot process; @image_error turns
    # that into a more precise status (502/415/422) + X-ImageProxy-Error header
    error_page                       415 @image_error;
    recursive_error_pages            on; # so @image_error can re-raise 502/422
    set $image_error                 "";

    # begin image_filter stuff
    image_filter_buffer              20M;
    image_filter_interlace           on;

    # needed to allow uri protocol slashes from being merged
    merge_slashes                    off;


  # proxy_redirect                   off;
    # client ip: the site server forwards it in X-Forwarded-For, restored by cdn-ips.conf
    proxy_set_header                 X-Real-IP       $remote_addr;
    proxy_set_header                 X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header                 User-Agent      "$http_user_agent";

    proxy_connect_timeout            30s;
    proxy_send_timeout               30s;
    proxy_read_timeout               30s;
    proxy_temp_path                  /var/cache/nginx/temp;


    # prevent client headers from going to origin
    proxy_pass_request_headers       off;

    proxy_ignore_headers             Vary Expires Set-Cookie Cache-Control;
    proxy_pass_header                P3P;
    proxy_cache_min_uses             2;
    proxy_cache                      imgresize;
    proxy_ssl_server_name            on;
    proxy_intercept_errors           on;
    proxy_cache_use_stale            updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update    on;

    # valid for "any" http status within 10 minutes
    proxy_cache_valid                any 10m;
    proxy_cache_valid                301 302 307 0s;
    proxy_cache_key                  $request_uri;

    # only allow GET method
    proxy_method                     GET;

    # NOTE: named captures are used for anything holding url text: numbered captures
    # ($1) get re-escaped by nginx when the request uri has %xx, double-encoding urls
    location ~* ^/rx/(?<rx_args>[^\/]+)/(?<rx_rest>.*) {
        set $myargs                  "$rx_args";
        set $protocol                "http";
        set $image_uri               "$rx_rest";
        set $cmd                     "resize";
        set $image_path              "";
        set $clean_uri               "";

        # $rx_rest comes from the already-decoded $uri; take the origin url from the raw
        # $request_uri instead so it reaches the origin exactly as the client encoded
        # it ("+", "%2B", "%20", "=" in paths/queries stay intact).
        if ($request_uri ~* "^/rx/[^/?]+/(?<rx_image>[^?]*)") {
            set $image_uri $rx_image;
        }

        # compat: a fully encoded origin url (/rx/100/http%3A%2F%2Fhost%2Fa.jpg)
        if ($image_uri ~* "^https?%3A") {
            set_unescape_uri $image_uri $image_uri;
        }

        # if no protocol in URL, add them
        if ($image_uri !~ "(http:|https:)") {
            set $image_uri "http://$image_uri";
        }

        # now process the real image url
        if ($image_uri ~ "^(?<rx_proto>https?)[:\/]+(?<rx_host>[^/]*)(?<rx_path>.*)") {
            set $protocol $rx_proto;
            set $myhost $rx_host;
            set $image_path $rx_path;
            set $image_uri "$protocol://$myhost$image_path";
        }

        # SECURITY: without this allow-list the server will fetch images from ANY
        # host, including internal/private addresses (127.0.0.1, 10.x, 169.254.169.254
        # cloud metadata, ...).  Enable it and list your origin hosts in production.
        # if ($myhost !~ ".*(host1.com|host2.org|host3.edu|host4.net|host5.info)$") {
        #     set $image_uri "";
        #     set $debugkey "$myhost=denied";
        #     return 403;
        #     break;
        # }

# option keys must not be preceded by a letter, so e.g. "water_1" is not read as "r_1"
# width
        if ($myargs ~ "^(\d+)") {
            set $width $1;
        }

        if ($myargs ~ "(?<![A-Za-z])w_*(\d+)") {
            set $width $1;
        }

        if ($arg_w) {
            set $width $arg_w;
        }

# height
        if ($myargs ~ "(?<![A-Za-z])x(\d+)") {
            set $height $1;
        }

        if ($myargs ~ "(?<![A-Za-z])h_*(\d+)") {
            set $height $1;
        }

        if ($arg_h) {
            set $height $arg_h;
        }

# quality
        if ($myargs ~ "(?<![A-Za-z])q_*(\d+)") {
            set $quality $1;
        }

        if ($arg_q) {
            set $quality $arg_q;
        }

# rotate
        if ($myargs ~ "(?<![A-Za-z])r_*(\d+)") {
            set $rotate $1;
        }

        if ($arg_r) {
            set $rotate $arg_r;
        }

# gravity (implies crop): g_Center, gCenter or ?g=Center
        if ($myargs ~ "(?<![A-Za-z])g_*(NorthWest|NorthEast|SouthWest|SouthEast|North|South|West|East|Center)") {
            set $gravity $1;
            set $cmd "crop";
        }

        if ($arg_g) {
            set $gravity $arg_g;
            set $cmd "crop";
        }

# sharpen
        if ($myargs ~ "(?<![A-Za-z])e_*(\d+)") {
            set $sharpen $1;
        }

        if ($arg_e) {
            set $sharpen $arg_e;
        }

# output format
        if ($myargs ~ "(?<![A-Za-z])ofmt_*([A-Za-z]+)") {
            set $ofmt $1;
        }

        if ($arg_ofmt) {
            set $ofmt $arg_ofmt;
        }

# crop
        if ($myargs ~ "(?<![A-Za-z])c_*1") {
            set $cmd "crop";
        }

        if ($arg_c = "1") {
            set $cmd "crop";
        }

# resolved options as path-style args, so @handle_redirect keeps options that
# came from the query string (?w=100) when following an origin redirect
        set $redir_args "w_$width,h_$height,q_$quality,r_$rotate,e_$sharpen,ofmt_$ofmt,g_$gravity";
        if ($cmd = "crop") {
            set $redir_args "$redir_args,c_1";
        }

# strip proxy option args (w,h,q,r,g,e,c,ofmt,rz) so they are not sent to origin;
# each pass removes one, nginx has no loops so the pass is repeated
        set $origin_args "&$args&";
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }
        if ($origin_args ~ "^(?<oa_pre>.*)&(?:w|h|q|r|g|e|c|ofmt|rz)=[^&]*(?<oa_post>&.*)$") { set $origin_args $oa_pre$oa_post; }

        set $origin_qs "";
        if ($origin_args ~ "^&*(?<oa_qs>[^&].*?)&*$") {
            set $origin_qs "?$oa_qs";
        }

        set $debugkey "$image_uri?w=$width&h=$height&q=$quality&r=$rotate&e=$sharpen&g=$gravity&cmd=$cmd&ofmt=$ofmt";

        # no unescaping here: set_unescape_uri turns "+" into a space and breaks
        # urls like ...?img=ab+cd== (github issue #27)
        set $clean_uri              "$image_uri$origin_qs";
        rewrite ^ /cmd/$cmd last;
    }

    location /cmd/resize {
        internal;

        proxy_pass                  $clean_uri;
        include                     /etc/nginx/include/proxy-hide-headers.common;

        add_header                  X-ImageProxy-Cache $upstream_cache_status;
        add_header                  X-ImageProxy-Debug $debugkey;
        expires                     24h;
        add_header                  Cache-Control "public";

      # image_filter_water_image    /app/logo.png;
      # image_filter_water_pos      center;
        image_filter_scale_max      3;

        image_filter_sharpen        $sharpen;
        image_filter_jpeg_quality   $quality;
        image_filter_webp_quality   $quality;
        image_filter_output         $ofmt;
        image_filter                rotate $rotate;

        image_filter                resize $width $height;
    }

    location /cmd/crop {
        internal;

        proxy_pass                  $clean_uri;
        include                     /etc/nginx/include/proxy-hide-headers.common;

        add_header                  X-ImageProxy-Cache $upstream_cache_status;
        add_header                  X-ImageProxy-Debug $debugkey;
        expires                     24h;
        add_header                  Cache-Control "public";

      # image_filter_water_image  /app/logo.png;
      # image_filter_water_pos    center;
        image_filter_scale_max      3;

        image_filter_sharpen        $sharpen;
        image_filter_jpeg_quality   $quality;
        image_filter_webp_quality   $quality;
        image_filter_output         $ofmt;
        image_filter                rotate $rotate;

        image_filter_crop_offset    $crop_offx $crop_offy;
        image_filter                crop $width $height;
    }

    location @handle_redirect {
        set                         $image_uri "$upstream_http_location";

        # if relative url, append base path
        if ($image_uri !~ "(http:|https:)") {
            set $image_uri "$protocol://$myhost$image_uri";
        }

        # Location is already a valid (encoded) url, pass it through unchanged
        set $clean_uri              "http://127.0.0.1:9082/rx/$redir_args/$image_uri";
        proxy_cache_bypass          1;
        proxy_pass                  $clean_uri;
    }

    location @image_error {
        if ($origin_image_type = "not_image") {
            set $image_error        "origin did not return an image (content-type: $upstream_http_content_type)";
            return 502;
        }

        if ($origin_image_type = "supported") {
            set $image_error        "image could not be processed: corrupt or larger than image_filter_buffer ($upstream_http_content_type)";
            return 422;
        }

        # unsupported or unrecognized image format: keep 415
        set $image_error            "unsupported image format '$upstream_http_content_type', supported: jpeg, png, gif, webp, bmp, tiff";
        add_header                  X-ImageProxy-Error $image_error always;
        add_header                  X-ImageProxy-Debug $debugkey always;
        empty_gif;
    }

    location @empty_gif {
        add_header                  X-ImageProxy-Error $image_error always;
        add_header                  X-ImageProxy-Debug $debugkey always;
        empty_gif;
    }
}
