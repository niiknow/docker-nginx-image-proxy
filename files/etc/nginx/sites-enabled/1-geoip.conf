# JSONP callback must be a plain JS identifier, anything else is rejected (prevents XSS)
map $arg_callback $geoip_callback {
    ""                                  "";
    "~^[A-Za-z_][0-9A-Za-z_.]{0,63}$"   "ok";
    default                             "invalid";
}

server {
    listen      127.0.0.1:9081;
    resolver    8.8.8.8 8.8.4.4 ipv6=off;
    access_log  off;
    charset     utf-8;

    # set at server level so every format below inherits them
    # (an add_header inside a location/if drops all inherited ones)
    add_header Cache-Control  no-cache;
    add_header access-control-allow-methods "OPTIONS,GET";
    add_header access-control-allow-credentials "true";
    add_header access-control-allow-headers "authorization,x-csrf-token,x-requested-with";
    add_header X-Content-Type-Options nosniff;

    set $geoip_json '{"ip":"$realip","country_code":"$geoip2_country_code","region_code":"$geoip2_region_code","region_name":"$geoip2_region","city":"$geoip2_city","zip_code":"$geoip2_postal_code","latitude":"$geoip2_latitude","longitude":"$geoip2_longitude","metro_code":"$geoip2_dma_code"}';

    location / {
        if ($geoip_callback = "invalid") {
            return 400;
        }

        if ($geoip_callback = "ok") {
            rewrite ^ /_geoip_jsonp last;
        }

        if ($arg_format = "xml") {
            rewrite ^ /_geoip_xml last;
        }

        if ($arg_format = "csv") {
            rewrite ^ /_geoip_csv last;
        }

        default_type application/json;
        return 200 $geoip_json;
    }

    # each format has its own location so it sends exactly one Content-Type
    location = /_geoip_jsonp {
        internal;
        default_type application/javascript;
        return 200 '/**/$arg_callback($geoip_json);';
    }

    location = /_geoip_xml {
        internal;
        default_type application/xml;
        return 200 '<Response><IP>$realip</IP><CountryCode>$geoip2_country_code</CountryCode><CountryName>$geoip2_country</CountryName><RegionCode>$geoip2_region_code</RegionCode><RegionName>$geoip2_region</RegionName><City>$geoip2_city</City><ZipCode>$geoip2_postal_code</ZipCode><Latitude>$geoip2_latitude</Latitude><Longitude>$geoip2_longitude</Longitude><MetroCode>$geoip2_dma_code</MetroCode></Response>';
    }

    location = /_geoip_csv {
        internal;
        default_type text/csv;
        return 200 '$realip,$geoip2_country_code,$geoip2_region_code,$geoip2_region,$geoip2_city,$geoip2_postal_code,$geoip2_latitude,$geoip2_longitude,$geoip2_dma_code';
    }
}
